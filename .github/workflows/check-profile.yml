name: Check profile

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - README.md
      - assets/**
      - scripts/**
      - tests/**
      - .github/workflows/**

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Check local image references and SVG dependencies
        run: python3 scripts/check_profile.py
      - name: Check language statistics
        run: python3 -m unittest discover -s tests -v
