name: Update profile stats

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - scripts/generate_profile_stats.py
      - .github/workflows/update-profile-stats.yml

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Generate live SVG cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USERNAME: ${{ github.repository_owner }}
        run: python3 scripts/generate_profile_stats.py --username "$PROFILE_USERNAME"

      - name: Commit changed cards
        run: |
          if git diff --quiet -- assets/player-stats.svg assets/main-loadout.svg; then
            echo "Profile statistics are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/player-stats.svg assets/main-loadout.svg
          git commit -m "chore: refresh profile stats"
          git push
